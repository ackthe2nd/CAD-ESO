# Fly.io deployment configuration for Resgrid-ESO Bridge v2.0

app = "resgrid2eso"
primary_region = "lax"

[build]

[env]
  PORT = "5000"
  NODE_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[vm.mounts]]
  source = "resgrid_data"
  destination = "/data"

[metrics]
  port = 9091
  path = "/metrics"