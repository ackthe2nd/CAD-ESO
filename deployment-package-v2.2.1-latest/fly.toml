app = "resgrid2eso"
primary_region = "lax"

[build]

[env]
  NODE_ENV = "production"
  PORT = "5000"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/status"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[vm.restart_policy]]
  policy = "on-failure"
  max_retries = 3